# Dev environment for the control plane (Postgres + Tomcat server).
# A lightweight dev stack; for a real host install use ./setup.sh (Docker) or ./setup.sh --native.
# Usage and the post-start seeding step are documented in docs/DEV.md.

services:
  postgres:
    image: postgres:14
    environment:
      POSTGRES_DB: mdmesh
      POSTGRES_USER: mdmesh
      POSTGRES_PASSWORD: mdmesh
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # SQL seed scripts mounted read-only; run manually AFTER first startup
      # (they UPDATE rows Liquibase creates at app boot — not an initdb script).
      - ./install/sql:/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mdmesh -d mdmesh"]
      interval: 5s
      timeout: 5s
      retries: 20

  server:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: mdmesh
      DB_USER: mdmesh
      DB_PASSWORD: mdmesh
      BASE_URL: http://localhost:8080
      HASH_SECRET: dev-only-change-me
      PLAY_STORE_ENABLED: ${PLAY_STORE_ENABLED:-false}
      PLAY_BRIDGE_URL: ${PLAY_BRIDGE_URL:-http://play-bridge:8787}
      PLAY_BRIDGE_API_KEY: ${PLAY_BRIDGE_API_KEY:-}
      PLAY_DISPENSER_PUBLIC_URL: http://localhost:8080/play-dispenser
    # 31000 is the embedded MQTT broker; expose if you want devices to reach it directly.
    # - "31000:31000"

  play-bridge:
    profiles: ["playstore"]
    build:
      context: ./play-bridge
    environment:
      PLAY_BRIDGE_API_KEY: ${PLAY_BRIDGE_API_KEY:-}
      GPLAYDL_DISPENSER_URL: http://play-dispenser:8080
      PLAY_DEVICE_ARCH: ${PLAY_DEVICE_ARCH:-arm64}
      PLAY_DEVICE_LOCALE: ${PLAY_DEVICE_LOCALE:-en-US}
    volumes:
      - playdata:/data
    depends_on:
      play-dispenser:
        condition: service_healthy

  play-dispenser-db:
    profiles: ["playstore"]
    image: postgres:14-alpine
    environment:
      POSTGRES_DB: dispenser
      POSTGRES_USER: dispenser
      POSTGRES_PASSWORD: ${PLAY_DISPENSER_DB_PASSWORD:-play-dev}
    volumes:
      - playdb:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dispenser -d dispenser"]
      interval: 5s
      timeout: 5s
      retries: 20

  play-dispenser:
    profiles: ["playstore"]
    build:
      context: .
      dockerfile: docker/play-dispenser.Dockerfile
    depends_on:
      play-dispenser-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://dispenser:${PLAY_DISPENSER_DB_PASSWORD:-play-dev}@play-dispenser-db:5432/dispenser?sslmode=disable
      DISPENSER_ENCRYPTION_KEY: ${PLAY_DISPENSER_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      DISPENSER_DEV: "1"
      PUBLIC_URL: http://localhost:8080/play-dispenser
      DEFAULT_DEVICE: arm64_xxhdpi
      RESOURCES_DIR: /app/resources
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
  playdata:
  playdb:
