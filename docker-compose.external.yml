# MDMesh behind an existing reverse proxy, using an existing PostgreSQL server.
# The reverse proxy and PostgreSQL must be reachable on EXTERNAL_NETWORK.
# Caddy remains the internal web gateway: it serves the SPA and routes API,
# WebSocket, update and recovery requests, but it does not terminate TLS.
services:
  server:
    image: ghcr.io/${IMAGE_OWNER:-mdmesh-app}/mdmesh-server:${SERVER_VERSION:-latest}
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST:?set DB_HOST in .env}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-mdmesh}
      DB_USER: ${DB_USER:-mdmesh}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      BASE_URL: ${BASE_URL:?set BASE_URL in .env}
      HASH_SECRET: ${HASH_SECRET:?set HASH_SECRET in .env}
      SECURE_ENROLLMENT: ${SECURE_ENROLLMENT:-0}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_FROM: ${SMTP_FROM:-mdm@localhost}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      PLAY_STORE_ENABLED: ${PLAY_STORE_ENABLED:-false}
      PLAY_BRIDGE_URL: ${PLAY_BRIDGE_URL:-http://play-bridge:8787}
      PLAY_BRIDGE_API_KEY: ${PLAY_BRIDGE_API_KEY:-}
      PLAY_DEVICE_PROFILE: ${PLAY_DEVICE_PROFILE:-arm64-v8a}
      PLAY_DISPENSER_PUBLIC_URL: ${PLAY_DISPENSER_PUBLIC_URL:-}
    volumes:
      - mdmeshdata:/opt/mdmesh
    networks:
      - internal
      - external

  play-bridge:
    profiles: ["playstore"]
    image: mdmesh-play-bridge:external
    build:
      context: ./play-bridge
    restart: unless-stopped
    depends_on:
      play-dispenser:
        condition: service_healthy
    environment:
      PLAY_BRIDGE_API_KEY: ${PLAY_BRIDGE_API_KEY:-}
      GPLAYDL_DISPENSER_URL: http://play-dispenser:8080
      PLAY_DEVICE_ARCH: ${PLAY_DEVICE_ARCH:-arm64}
      PLAY_DEVICE_LOCALE: ${PLAY_DEVICE_LOCALE:-en-US}
    volumes:
      - playdata:/data
    networks:
      - internal

  play-dispenser-db:
    profiles: ["playstore"]
    image: postgres:14-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dispenser
      POSTGRES_USER: dispenser
      POSTGRES_PASSWORD: ${PLAY_DISPENSER_DB_PASSWORD:-}
    volumes:
      - playdb:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dispenser -d dispenser"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - internal

  play-dispenser:
    profiles: ["playstore"]
    image: mdmesh-play-dispenser:external
    build:
      context: .
      dockerfile: docker/play-dispenser.Dockerfile
    restart: unless-stopped
    depends_on:
      play-dispenser-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://dispenser:${PLAY_DISPENSER_DB_PASSWORD:-}@play-dispenser-db:5432/dispenser?sslmode=disable
      DISPENSER_ENCRYPTION_KEY: ${PLAY_DISPENSER_ENCRYPTION_KEY:-}
      PUBLIC_URL: ${PLAY_DISPENSER_PUBLIC_URL:-}
      DEFAULT_DEVICE: arm64_xxhdpi
      RESOURCES_DIR: /app/resources
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - internal

  caddy:
    image: ghcr.io/${IMAGE_OWNER:-mdmesh-app}/mdmesh-web:${WEB_VERSION:-latest}
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        VITE_AGENT_PACKAGE: ${VITE_AGENT_PACKAGE:-}
        VITE_AGENT_CHECKSUM: ${VITE_AGENT_CHECKSUM:-}
        VITE_AGENT_APK_URL: ${VITE_AGENT_APK_URL:-}
    restart: unless-stopped
    depends_on:
      - server
      - supervisor
    environment:
      SITE_ADDRESS: ":80"
      TRUSTED_PROXIES: private_ranges
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      internal:
      external:
        aliases:
          - mdmesh-web

  supervisor:
    image: ${SUPERVISOR_IMAGE:-mdmesh-supervisor:external}
    build:
      context: .
      dockerfile: docker/supervisor.Dockerfile
    restart: unless-stopped
    environment:
      GITHUB_REPO: ${GITHUB_REPO:-MDMesh-app/MDMesh}
      UPDATE_CHANNEL: ${UPDATE_CHANNEL:-stable}
      POLL_INTERVAL_HOURS: ${POLL_INTERVAL_HOURS:-6}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      CURRENT_VERSION: ${CURRENT_VERSION:-0.0.0}
      AUTO_UPDATE: ${AUTO_UPDATE:-0}
      APPLY_SUPPORTED: ${APPLY_SUPPORTED:-1}
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-mdmesh}
      COMPOSE_FILE: ${COMPOSE_FILE:-docker-compose.external.yml}
      COMPOSE_PROFILES: ${COMPOSE_PROFILES:-}
      DB_HOST: ${DB_HOST:?set DB_HOST in .env}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-mdmesh}
      DB_NAME: ${DB_NAME:-mdmesh}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/project
      - backups:/backups
    networks:
      - internal
      - external

  # One-shot PostgreSQL client used by setup-external.sh. It never runs as
  # part of the normal stack and owns no database storage.
  db-tools:
    image: postgres:17
    profiles: ["tools"]
    environment:
      PGHOST: ${DB_HOST:?set DB_HOST in .env}
      PGPORT: ${DB_PORT:-5432}
      PGDATABASE: ${DB_NAME:-mdmesh}
      PGUSER: ${DB_USER:-mdmesh}
      PGPASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    networks:
      - external

networks:
  internal:
    internal: true
  external:
    external: true
    name: ${EXTERNAL_NETWORK:-nginx_network}

volumes:
  mdmeshdata:
  caddy_data:
  caddy_config:
  backups:
  playdata:
  playdb:
