# Pull-only MDMesh stack — no build context, every service runs a published GHCR image. This is the
# "no clone, no build" deploy. Easiest via quickstart.sh, or by hand:
#
#   curl -fsSLO https://raw.githubusercontent.com/MDMesh-app/MDMesh/main/docker-compose.release.yml
#   # write a .env (DB_PASSWORD, HASH_SECRET, BASE_URL, IMAGE_OWNER, …) — see quickstart.sh
#   docker compose -f docker-compose.release.yml --profile cloudflare up -d                 # tunnel
#   docker compose -f docker-compose.release.yml -f docker-compose.domain.yml up -d         # own domain
#
# Pin SERVER_VERSION/WEB_VERSION/SUPERVISOR_VERSION in .env for production; they default to :latest.
services:
  postgres:
    image: postgres:14
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-mdmesh}
      POSTGRES_USER: ${DB_USER:-mdmesh}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mdmesh} -d ${DB_NAME:-mdmesh}"]
      interval: 5s
      timeout: 5s
      retries: 20

  server:
    image: ghcr.io/${IMAGE_OWNER:-mdmesh-app}/mdmesh-server:${SERVER_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-mdmesh}
      DB_USER: ${DB_USER:-mdmesh}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      BASE_URL: ${BASE_URL:?set BASE_URL in .env}
      HASH_SECRET: ${HASH_SECRET:?set HASH_SECRET in .env}
      SECURE_ENROLLMENT: ${SECURE_ENROLLMENT:-0}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_FROM: ${SMTP_FROM:-mdm@localhost}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      PLAY_STORE_ENABLED: ${PLAY_STORE_ENABLED:-false}
      PLAY_BRIDGE_URL: ${PLAY_BRIDGE_URL:-http://play-bridge:8787}
      PLAY_BRIDGE_API_KEY: ${PLAY_BRIDGE_API_KEY:-}
      PLAY_DEVICE_PROFILE: ${PLAY_DEVICE_PROFILE:-arm64-v8a}
      PLAY_DISPENSER_PUBLIC_URL: ${PLAY_DISPENSER_PUBLIC_URL:-}
    volumes:
      - mdmeshdata:/opt/mdmesh

  play-bridge:
    profiles: ["playstore"]
    image: ghcr.io/${IMAGE_OWNER:-mdmesh-app}/mdmesh-play-bridge:${SERVER_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      play-dispenser:
        condition: service_healthy
    environment:
      PLAY_BRIDGE_API_KEY: ${PLAY_BRIDGE_API_KEY:-}
      GPLAYDL_DISPENSER_URL: http://play-dispenser:8080
      PLAY_DEVICE_ARCH: ${PLAY_DEVICE_ARCH:-arm64}
      PLAY_DEVICE_LOCALE: ${PLAY_DEVICE_LOCALE:-en-US}
    volumes:
      - playdata:/data

  play-dispenser-db:
    profiles: ["playstore"]
    image: postgres:14-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dispenser
      POSTGRES_USER: dispenser
      POSTGRES_PASSWORD: ${PLAY_DISPENSER_DB_PASSWORD:-}
    volumes:
      - playdb:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dispenser -d dispenser"]
      interval: 5s
      timeout: 5s
      retries: 20

  play-dispenser:
    profiles: ["playstore"]
    image: ghcr.io/${IMAGE_OWNER:-mdmesh-app}/mdmesh-play-dispenser:${SERVER_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      play-dispenser-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://dispenser:${PLAY_DISPENSER_DB_PASSWORD:-}@play-dispenser-db:5432/dispenser?sslmode=disable
      DISPENSER_ENCRYPTION_KEY: ${PLAY_DISPENSER_ENCRYPTION_KEY:-}
      PUBLIC_URL: ${PLAY_DISPENSER_PUBLIC_URL:-}
      DEFAULT_DEVICE: arm64_xxhdpi
      RESOURCES_DIR: /app/resources
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  caddy:
    image: ghcr.io/${IMAGE_OWNER:-mdmesh-app}/mdmesh-web:${WEB_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      - server
      - supervisor
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - caddy_data:/data
      - caddy_config:/config

  supervisor:
    image: ghcr.io/${IMAGE_OWNER:-mdmesh-app}/mdmesh-supervisor:${SUPERVISOR_VERSION:-latest}
    restart: unless-stopped
    environment:
      GITHUB_REPO: ${GITHUB_REPO:-}
      UPDATE_CHANNEL: ${UPDATE_CHANNEL:-stable}
      POLL_INTERVAL_HOURS: ${POLL_INTERVAL_HOURS:-6}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      CURRENT_VERSION: ${CURRENT_VERSION:-0.0.0}
      AUTO_UPDATE: ${AUTO_UPDATE:-0}
      # Set 0 to hide one-click apply (the console then shows the manual upgrade steps).
      APPLY_SUPPORTED: ${APPLY_SUPPORTED:-1}
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-mdmesh}
      COMPOSE_FILE: ${COMPOSE_FILE:-docker-compose.yml}
      COMPOSE_PROFILES: ${COMPOSE_PROFILES:-}
      DB_USER: ${DB_USER:-mdmesh}
      DB_NAME: ${DB_NAME:-mdmesh}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/project
      - backups:/backups

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles: ["cloudflare"]
    depends_on:
      - caddy
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}

volumes:
  pgdata:
  mdmeshdata:
  caddy_data:
  caddy_config:
  backups:
  playdata:
  playdb:
